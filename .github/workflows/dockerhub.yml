name: Publish Docker Hub Image

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_REPOSITORY: 34v0wphix/aurora

jobs:
  publish:
    name: Build and push linux/amd64 + linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            {
              echo 'tags<<EOF'
              echo "${DOCKERHUB_REPOSITORY}:latest"
              echo "${DOCKERHUB_REPOSITORY}:${{ steps.version.outputs.version }}"
              echo "${DOCKERHUB_REPOSITORY}:sha-${GITHUB_SHA}"
              echo 'EOF'
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo 'tags<<EOF'
              echo "${DOCKERHUB_REPOSITORY}:dev"
              echo "${DOCKERHUB_REPOSITORY}:dev-${{ steps.version.outputs.version }}"
              echo "${DOCKERHUB_REPOSITORY}:dev-sha-${GITHUB_SHA}"
              echo 'EOF'
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=dockerhub-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=dockerhub-${{ github.ref_name }}
