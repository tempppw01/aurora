services:
  aurora:
    image: 34v0wphix/aurora:latest
    container_name: aurora
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      # Set both variables in .env before starting the service.
      Authorization: ${AURORA_API_KEY:?Set AURORA_API_KEY in .env}
      ADMIN_TOKEN: ${AURORA_ADMIN_TOKEN:?Set AURORA_ADMIN_TOKEN in .env}
      STREAM_MODE: "true"
      ENABLE_HISTORY: "false"
    volumes:
      # Account pool, admin settings, and request logs are all persisted here.
      - aurora-data:/data

volumes:
  aurora-data:
