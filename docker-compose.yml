services:
  aurora:
    # Docker Hub 多架构镜像：同时支持 x86_64 和 ARM64（NAS）。
    image: 34v0wphix/aurora:latest
    container_name: aurora
    # 容器异常退出或主机重启后自动恢复。
    restart: unless-stopped
    ports:
      # 左侧是宿主机对外端口，避免使用常见的 8080；右侧为容器内部服务端口。
      - "18188:8080"
    environment:
      # 必须改成自己的随机密钥后再启动。
      # OpenAI 兼容接口的访问密钥，客户端请求头为 Authorization: Bearer 此值。
      Authorization: "请替换为一条足够长的随机 API 密钥"
      # /admin 管理台密钥；建议与上面的 API 密钥不同。
      ADMIN_TOKEN: "请替换为另一条足够长的随机管理台密钥"
    volumes:
      # 账号池、管理台设置和请求日志都保存到当前目录 data，重建容器也不会丢失。
      # 直接备份此目录即可；请限制宿主机目录的读取权限。
      - ./data:/data
